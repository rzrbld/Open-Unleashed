[workspace]
resolver = "2"
members = [
    "crates/nfs-formats",
    "crates/nfs-assets",
    "crates/nfs-math",
    "crates/nfs-physics",
    "crates/nfs-renderer",
    "crates/nfs-audio",
    "crates/nfs-input",
    "crates/nfs-net",
    "crates/nfs-game",
    "crates/open-unleashed",
    "crates/winit-sdl2",
    "tools/asset-inspector",
    "tools/asset-extractor",
    "tools/format-dumper",
]

[workspace.package]
version = "0.1.5"
edition = "2024"
license = "GPL-3.0-or-later"
rust-version = "1.95"

[workspace.dependencies]
nfs-formats = { path = "crates/nfs-formats" }
nfs-assets = { path = "crates/nfs-assets" }
nfs-math = { path = "crates/nfs-math" }
nfs-physics = { path = "crates/nfs-physics" }
nfs-renderer = { path = "crates/nfs-renderer" }
nfs-audio = { path = "crates/nfs-audio", default-features = false }
nfs-input = { path = "crates/nfs-input" }
nfs-net = { path = "crates/nfs-net" }
nfs-game = { path = "crates/nfs-game" }

thiserror = "2"
anyhow = "1"
glam = "0.33"
bytemuck = { version = "1", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["png"] }
# ReNFS5: the game's winit calls go to a winit-compatible layer over the firmware's SDL2
# (window, keyboard, mouse, GLES / Vulkan context); the viewers in tools/ that need the real winit are left out
winit = { package = "winit-sdl2", path = "crates/winit-sdl2" }
sdl2-sys = "0.38"
wgpu = "30"
pollster = "1"
# ReNFS5: controllers, haptics and (optionally) audio go through the firmware's SDL2 as well;
# a second, static SDL (SDL3) in the same process would clash with it
cpal = "0.18"
libm = "0.2"

[profile.release]
debug = 1
# perf: whole-program optimisation (PA, RE/notes/PERF.md); Rust does no fast-math / FMA contraction,
# so the floating-point results are unchanged
lto = "fat"
codegen-units = 1

# ReNFS5: wgpu-hal with one hook — a Vulkan surface made by SDL2 (`SDL_Vulkan_CreateSurface`, the
# handhelds' KMSDRM display) is taken as the window's surface (`vulkan::set_external_surface`)
[patch.crates-io]
wgpu-hal = { path = "patches/wgpu-hal" }
